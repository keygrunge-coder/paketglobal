<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Retur JNT</title>

<style>
.header-box {
    background: #003399; /* Warna biru */
    color: #fff;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 20px;
    text-align: center;
}

.btn-nav {
    background: #cc0000; /* Warna merah */
    color: white;
    border: none;
    padding: 8px 15px;
    font-weight: bold;
    border-radius: 5px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    margin: 5px; /* Memberi jarak antar tombol */
    font-size: 13px;
}
    
body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
}

textarea{
    width:100%;
    height:350px;
    padding:10px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    margin-top:10px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
}

#hasil{
    margin-top:20px;
    white-space:pre-wrap;
}  
</style>

</head>
<body>

<div class="container">

<div class="header-box">
<h3> <B>UPLOAD RETUR TIKTOK TOKOPEDIA</B> </h3>
<a href="retur.html" class="btn-nav"> SCAN RETUR</a>
<a href="upload_spx.html" class="btn-nav">UPLOAD RETUR SPX</a>
</div>

<textarea id="rawData"
placeholder="Paste data TikTok / Shopee di sini"></textarea>

<button onclick="uploadRetur()">
Upload ke Sheet
</button>

<div id="hasil"></div>

</div>

<script>

const APP_URL = "https://script.google.com/macros/s/AKfycbyuJTOZaFhOZ52fFKPCxFIulD5rTFJb6VehsELtOZgjmaJf0Epc4Jm71gcPVLtE9sJK/exec";

async function uploadRetur(){

    const text = document.getElementById("rawData").value.trim();

    if(!text){
        alert("Paste data dulu");
        return;
    }

    document.getElementById("hasil").innerHTML =
        "Sedang memproses...";

    try{

        const r = await fetch(APP_URL,{
            method:"POST",
            body:JSON.stringify({
                source:"uploadRetur",
                text:text
            })
        });

        const json = await r.json();

        document.getElementById("hasil").innerHTML =
            JSON.stringify(json,null,2);

    }catch(err){

        document.getElementById("hasil").innerHTML =
            err.toString();

    }
}

</script>

</body>
</html>
